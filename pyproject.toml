[project]
name = "shopcore"
version = "0.1.0"
description = "A core library for the ShopCore project."
readme = "README.md"
authors = [
    { name = "rdf-mal", email = "240441674+rdf-mal@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
shopcore = "shopcore.main:run"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff.lint]
# Aktiviere standardmäßig Pyflakes (F) und pycodestyle (E)
# "I" fügt isort für das Sortieren von Imports hinzu
select = ["E", "F", "I"]

[tool.ruff.format]
# Einstellungen für den Formatter (z.B. ob Single- oder Double-Quotes)
quote-style = "double"